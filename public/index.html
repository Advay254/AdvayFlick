  .hero{position:relative;height:100svh;max-height:680px;overflow:hidden;}

  .hero-badge-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}

  .hero-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}

  .hero-btns{display:flex;gap:9px;}

  .hero-dot-btn.active{height:22px;background:var(--accent);box-shadow:0 0 7px rgba(212,146,42,0.55);}
  .search-wrap{padding:14px 16px 0;position:relative;z-index:5;background:linear-gradient(to bottom,var(--bg) 70%,transparent);}

<div class="toast-wrap" id="toastWrap"></div>

<script>
const haptic = ms => navigator.vibrate?.(ms);
function toast(msg){const w=document.getElementById('toastWrap');const el=document.createElement('div');el.className='toast';el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),3200);}

// ── Hero ──────────────────────────────────────────────────────────
let heroMovies=[],heroIdx=0,heroTimer=null;

function buildHero(movies){
  heroMovies=movies.filter(m=>m.background_image_original||m.background_image);
  const slidesEl=document.getElementById('heroSlides');
  const dotsEl=document.getElementById('heroDots');
  slidesEl.innerHTML='';dotsEl.innerHTML='';
  heroMovies.slice(0,6).forEach((m,i)=>{
    const slide=document.createElement('div');
    slide.className='hero-slide';
    slide.style.backgroundImage=`url(${m.background_image_original||m.background_image})`;
    slidesEl.appendChild(slide);
    const dot=document.createElement('button');
    dot.className='hero-dot-btn';
    dot.onclick=()=>{haptic([5]);goHero(i);};
    dotsEl.appendChild(dot);
  });
  showHero(0);
  heroTimer=setInterval(()=>goHero((heroIdx+1)%Math.min(heroMovies.length,6)),6000);
}

function showHero(i){
  heroIdx=i;const m=heroMovies[i];if(!m)return;
  document.querySelectorAll('.hero-slide').forEach((s,j)=>s.classList.toggle('active',j===i));
  document.querySelectorAll('.hero-dot-btn').forEach((d,j)=>d.classList.toggle('active',j===i));
  document.getElementById('heroTitle').textContent=m.title_long||m.title;
  document.getElementById('heroDesc').textContent=m.summary||m.description_full||'';
  const rating=parseFloat(m.rating)||0;
  document.getElementById('heroMeta').innerHTML=`
    <span class="hero-meta-item">${m.year}</span>
    <span class="hero-dot-sep"></span>
    <span class="hero-rating"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${rating.toFixed(1)}</span>
    ${m.runtime?`<span class="hero-dot-sep"></span><span class="hero-meta-item">${Math.floor(m.runtime/60)}h ${m.runtime%60}m</span>`:''}`;
  document.getElementById('heroBadges').innerHTML=(m.genres||[]).slice(0,2).map(g=>`<span class="pill pill-gold">${g}</span>`).join('');
  document.getElementById('heroWatchBtn').dataset.id=m.id;
  document.getElementById('heroInfoBtn').dataset.id=m.id;
}

function goHero(i){clearInterval(heroTimer);showHero(i);heroTimer=setInterval(()=>goHero((heroIdx+1)%Math.min(heroMovies.length,6)),6000);}
function heroGo(mode){const id=document.getElementById('heroWatchBtn').dataset.id;if(id){haptic([8]);location.href=`/movie.html?id=${id}${mode==='watch'?'&autoplay=1':''}`;}}

// ── Cards ─────────────────────────────────────────────────────────
function buildCard(m){
  const card=document.createElement('div');card.className='movie-card';
  const rating=parseFloat(m.rating)||0;
  card.innerHTML=`
    <img class="card-poster" src="${m.medium_cover_image||''}" alt="${m.title}" loading="lazy" onerror="this.style.background='var(--surface2)'"/>
    ${rating?`<div class="card-badge"><svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${rating.toFixed(1)}</div>`:''}
    <div class="card-footer"><div class="card-title">${m.title}</div><div class="card-meta"><span class="card-year">${m.year}</span></div></div>`;
  card.addEventListener('click',()=>{haptic([8]);location.href=`/movie.html?id=${m.id}`;});
  return card;
}

function renderRow(listId,skelId,movies){
  const list=document.getElementById(listId);
  const skel=document.getElementById(skelId);
  list.innerHTML='';
  movies.forEach(m=>list.appendChild(buildCard(m)));
  skel.style.display='none';list.style.display='flex';
}

// ── Genre ─────────────────────────────────────────────────────────
function selectGenre(genre,btn){
  haptic([6]);
  document.querySelectorAll('.genre-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const sec=document.getElementById('genreSection');
  if(!genre){sec.style.display='none';return;}
  const ICONS={Action:'⚔️',Comedy:'😂',Thriller:'🎯',Horror:'👻','Sci-Fi':'🚀',Animation:'🎨',Drama:'🎭',Romance:'❤️',Crime:'🔫',Adventure:'🧭',Documentary:'📽️'};
  document.getElementById('genreTitle').textContent=`${ICONS[genre]||'🎬'} ${genre}`;
  sec.style.display='block';
  document.getElementById('genreList').innerHTML=`<div class="loading-state"><div class="spinner"></div></div>`;
  sec.scrollIntoView({behavior:'smooth',block:'start'});
  fetch(`/api/genre/${encodeURIComponent(genre)}`)
    .then(r=>r.json())
    .then(data=>{
      const list=document.getElementById('genreList');list.innerHTML='';
      (data.data?.movies||[]).forEach(m=>list.appendChild(buildCard(m)));
    })
    .catch(()=>{document.getElementById('genreList').innerHTML='<div style="padding:20px;color:var(--text-3);font-size:0.82rem">Failed to load.</div>';});
}

// ── Search ────────────────────────────────────────────────────────
let searchTimer=null;
const searchInput=document.getElementById('searchInput');
const searchDropdown=document.getElementById('searchDropdown');

searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);const q=searchInput.value.trim();
  if(!q){searchDropdown.classList.remove('open');return;}
  searchTimer=setTimeout(()=>liveSearch(q),380);
});
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')goSearch();});
document.addEventListener('click',e=>{if(!e.target.closest('.search-row'))searchDropdown.classList.remove('open');});

async function liveSearch(q){
  try{
    const res=await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data=await res.json();
    const movies=(data.data?.movies||[]).slice(0,5);
    searchDropdown.innerHTML='';
    if(!movies.length){searchDropdown.innerHTML=`<div style="padding:12px;text-align:center;color:var(--text-3);font-size:0.8rem">No results</div>`;}
    else{
      movies.forEach(m=>{
        const item=document.createElement('div');item.className='sd-item';
        item.innerHTML=`<img class="sd-poster" src="${m.small_cover_image||''}" alt="${m.title}" loading="lazy"/><div style="flex:1;min-width:0"><div class="sd-title">${m.title_long||m.title}</div><div class="sd-meta">${m.year} · ⭐ ${parseFloat(m.rating||0).toFixed(1)}</div></div>`;
        item.onclick=()=>{haptic([8]);location.href=`/movie.html?id=${m.id}`;};
        searchDropdown.appendChild(item);
      });
      const all=document.createElement('div');all.className='sd-item';
      all.style.cssText='border-top:1px solid var(--border);justify-content:center;color:var(--accent);font-size:0.8rem;font-weight:500';
      all.textContent=`See all results for "${q}"`;
      all.onclick=()=>location.href=`/results.html?q=${encodeURIComponent(q)}`;
      searchDropdown.appendChild(all);
    }
    searchDropdown.classList.add('open');
  }catch{}
}

function goSearch(){const q=searchInput.value.trim();if(q)location.href=`/results.html?q=${encodeURIComponent(q)}`;}

// ── Init ──────────────────────────────────────────────────────────
async function init(){
  try{
    const [trending,newR,topR,popular]=await Promise.allSettled([
      fetch('/api/trending').then(r=>r.json()),
      fetch('/api/new').then(r=>r.json()),
      fetch('/api/toprated').then(r=>r.json()),
      fetch('/api/popular').then(r=>r.json()),
    ]);
    if(trending.status==='fulfilled'&&trending.value.data?.movies?.length){buildHero(trending.value.data.movies);renderRow('trendingList','trendingSkel',trending.value.data.movies);}
    else document.getElementById('trendingSkel').style.display='none';
    if(newR.status==='fulfilled'&&newR.value.data?.movies?.length)renderRow('newList','newSkel',newR.value.data.movies);
    else document.getElementById('newSkel').style.display='none';
    if(topR.status==='fulfilled'&&topR.value.data?.movies?.length)renderRow('topList','topSkel',topR.value.data.movies);
    else document.getElementById('topSkel').style.display='none';
    if(popular.status==='fulfilled'&&popular.value.data?.movies?.length)renderRow('popList','popSkel',popular.value.data.movies);
    else document.getElementById('popSkel').style.display='none';
  }catch(err){console.error(err);}
}
init();
</script>
<script src="/pwa.js"></script>
</body>
</html>
