  /* ═══ HERO ══════════════════════════════════════════════════ */
  .hero{position:relative;height:265px;overflow:hidden;background:#0a0a0d;}
  .hero-slides{position:absolute;inset:0;}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;}
  .hero-slide.active{opacity:1;}
  .hero-slide-blur{
    position:absolute;inset:-8%;
    background-size:cover;background-position:center;
    filter:blur(24px) brightness(0.2) saturate(0.7);transform:scale(1.06);
  }

  .hero-dots{position:absolute;right:9px;bottom:70px;z-index:3;display:flex;flex-direction:column;gap:4px;}

  /* ═══ HERO STRIP (MovieBox signature) ══════════════════════ */
  .hero-strip{

  .skeleton-card{
    width:110px;aspect-ratio:2/3;flex-shrink:0;border-radius:8px;

  /* ═══ CATEGORY VISUAL CARDS ═════════════════════════════════ */
  .cat-cards-row{display:flex;gap:8px;overflow-x:auto;padding:3px 13px 8px;scrollbar-width:none;}

    flex-shrink:0;width:136px;height:70px;border-radius:9px;

    border:1px solid rgba(255,255,255,0.07);transition:transform 0.22s,border-color 0.22s;

  .cat-vis-card:hover{border-color:rgba(212,146,42,0.28);}

  .cat-vis-card:hover .cat-vis-bg{filter:brightness(0.42) saturate(0.75);}
  .cat-vis-grad{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,0.7) 0%,transparent 100%);}
  .cat-vis-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:7px 9px;}
  .cat-vis-icon{font-size:1.2rem;line-height:1;margin-bottom:2px;}
  .cat-vis-name{font-size:0.7rem;font-weight:700;color:#eee8df;letter-spacing:0.03em;}

  /* ═══ GENRE RESULT SECTION ══════════════════════════════════ */
  #genreSection{display:none;margin-bottom:22px;}

  /* ═══ BOTTOM NAV ════════════════════════════════════════════ */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:200;
    display:flex;align-items:stretch;
    background:rgba(11,11,14,0.97);backdrop-filter:blur(22px);
    border-top:1px solid rgba(255,255,255,0.06);

  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;

  .nav-item svg{width:18px;height:18px;}
  .nav-item.active svg{filter:drop-shadow(0 0 5px rgba(212,146,42,0.45));}

  /* ═══ MISC ══════════════════════════════════════════════════ */
  .toast-wrap{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:9997;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
  .toast{background:#1a1a20;border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:8px 16px;font-size:0.78rem;box-shadow:0 8px 32px rgba(0,0,0,0.65);animation:tin 0.25s ease,tout 0.25s ease 2.7s forwards;white-space:nowrap;}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(8px)}}
  .ad-slot{margin:4px 13px;border-radius:9px;overflow:hidden;min-height:60px;display:flex;align-items:center;justify-content:center;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:20px;height:20px;border:2px solid rgba(212,146,42,0.15);border-top-color:#d4922a;border-radius:50%;animation:spin 0.7s linear infinite;}
  </style>
</head>

    Home
  </button>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const haptic = ms => navigator.vibrate?.(ms);
function toast(msg){const w=document.getElementById('toastWrap');const el=document.createElement('div');el.className='toast';el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),3200);}

// ── Hero ──────────────────────────────────────────────────────
let heroMovies=[],heroIdx=0,heroTimer=null;

function buildHero(movies){
  heroMovies=movies.filter(m=>m.large_cover_image||m.medium_cover_image);
  const slidesEl=document.getElementById('heroSlides');
  const dotsEl=document.getElementById('heroDots');
  slidesEl.innerHTML='';dotsEl.innerHTML='';
  heroMovies.slice(0,6).forEach((m,i)=>{
    const slide=document.createElement('div');
    slide.className='hero-slide';
    const blurDiv=document.createElement('div');
    blurDiv.className='hero-slide-blur';
    blurDiv.style.backgroundImage=`url(${m.large_cover_image||m.medium_cover_image})`;
    slide.appendChild(blurDiv);
    const gradDiv=document.createElement('div');
    gradDiv.className='hero-slide-grad';
    slide.appendChild(gradDiv);
    const posterImg=document.createElement('img');
    posterImg.className='hero-slide-poster';
    posterImg.src=m.large_cover_image||m.medium_cover_image;
    posterImg.alt=m.title;
    posterImg.loading=i===0?'eager':'lazy';
    slide.appendChild(posterImg);
    slidesEl.appendChild(slide);
    const dot=document.createElement('button');
    dot.className='hero-dot-btn';
    dot.onclick=()=>{haptic([4]);goHero(i);};
    dotsEl.appendChild(dot);
  });
  showHero(0);
  heroTimer=setInterval(()=>goHero((heroIdx+1)%Math.min(heroMovies.length,6)),6000);
}

function showHero(i){
  heroIdx=i;const m=heroMovies[i];if(!m)return;
  document.querySelectorAll('.hero-slide').forEach((s,j)=>s.classList.toggle('active',j===i));
  document.querySelectorAll('.hero-dot-btn').forEach((d,j)=>d.classList.toggle('active',j===i));
  document.getElementById('heroTitle').textContent=m.title_long||m.title;
  const rating=parseFloat(m.rating)||0;
  document.getElementById('heroMeta').innerHTML=`
    <span>${m.year}</span><span class="hdot"></span>
    <span class="hero-rating"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${rating.toFixed(1)}</span>
    ${m.runtime?`<span class="hdot"></span><span>${Math.floor(m.runtime/60)}h ${m.runtime%60}m</span>`:''}
  `;
  document.getElementById('heroBadges').innerHTML=(m.genres||[]).slice(0,2).map(g=>`<span class="hero-badge">${g}</span>`).join('');
  buildStrip(i);
}

// ── MovieBox-style hero strip ─────────────────────────────────
function buildStrip(current){
  const strip=document.getElementById('heroStrip');
  strip.innerHTML='';
  const total=Math.min(heroMovies.length,6);
  const indices=[current,(current+1)%total];
  indices.forEach((idx,pos)=>{
    const m=heroMovies[idx];if(!m)return;
    const card=document.createElement('div');
    card.className='strip-card'+(pos===0?' strip-active':'');
    const quality=getQuality(m);
    card.innerHTML=`
      <img class="strip-thumb" src="${m.small_cover_image||m.medium_cover_image||''}" alt="${m.title}" loading="lazy"/>
      <div class="strip-info">
        <div class="strip-icon">🎬${quality?` <b style="color:#f0b84a">${quality}</b>`:''}</div>
        <div class="strip-title">${m.title}</div>
        <div class="strip-meta">${m.year}${m.genres?.[0]?' · '+m.genres[0]:''}</div>
      </div>
      <button class="strip-play" title="Watch now">
        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
      </button>
    `;
    card.querySelector('.strip-play').onclick=e=>{e.stopPropagation();haptic([6]);location.href=`/movie.html?id=${m.id}&autoplay=1`;};
    card.addEventListener('click',()=>{
      if(pos===0){haptic([6]);location.href=`/movie.html?id=${m.id}`;}
      else{haptic([4]);goHero(idx);}
    });
    strip.appendChild(card);
  });
}

function goHero(i){clearInterval(heroTimer);showHero(i);heroTimer=setInterval(()=>goHero((heroIdx+1)%Math.min(heroMovies.length,6)),6000);}

// ── Category background images (lazy, staggered) ──────────────
const catBgMap={Action:'bgAction',Horror:'bgHorror','Sci-Fi':'bgSciFi',Comedy:'bgComedy',Thriller:'bgThriller',Romance:'bgRomance',Animation:'bgAnim',Crime:'bgCrime'};
async function loadCatBackgrounds(){
  for(const[genre,elId] of Object.entries(catBgMap)){
    const el=document.getElementById(elId);if(!el)continue;
    try{
      const r=await fetch(`/api/genre/${encodeURIComponent(genre)}`);
      const d=await r.json();
      const first=d.data?.movies?.[0];
      if(first?.large_cover_image)el.style.backgroundImage=`url(${first.large_cover_image})`;
    }catch{}
    await new Promise(res=>setTimeout(res,150));
  }
}

// ── Quality badge helper ──────────────────────────────────────
function getQuality(m){
  if(!m.torrents?.length)return'';
  const q=m.torrents.find(t=>t.quality==='2160p')
    ||m.torrents.find(t=>t.quality==='1080p')
    ||m.torrents.find(t=>t.quality==='720p')
    ||m.torrents[0];
  return q?.quality||'';
}

// ── Cards ─────────────────────────────────────────────────────
function buildCard(m){
  const card=document.createElement('div');card.className='movie-card';
  const rating=parseFloat(m.rating)||0;
  const quality=getQuality(m);
  const qClass=quality==='2160p'?'q4k':quality==='1080p'?'q1080':'q720';
  card.innerHTML=`
    <img class="card-poster" src="${m.medium_cover_image||''}" alt="${m.title}" loading="lazy" onerror="this.style.background='#1c1d25'"/>
    ${rating?`<div class="card-rating"><svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${rating.toFixed(1)}</div>`:''}
    ${quality?`<div class="card-quality ${qClass}">${quality==='2160p'?'4K':quality}</div>`:''}
    <div class="card-footer">
      <div class="card-title">${m.title}</div>
      <div class="card-year">${m.year}</div>
    </div>
  `;
  card.addEventListener('click',()=>{haptic([7]);location.href=`/movie.html?id=${m.id}`;});
  return card;
}

function renderRow(listId,skelId,movies){
  const list=document.getElementById(listId);
  const skel=document.getElementById(skelId);
  list.innerHTML='';
  movies.forEach(m=>list.appendChild(buildCard(m)));
  skel.style.display='none';list.style.display='flex';
}

// ── Category Tab ──────────────────────────────────────────────
function selectTab(genre,btn){
  haptic([5]);
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const sec=document.getElementById('genreSection');
  const main=document.getElementById('mainContent');
  if(!genre){sec.style.display='none';main.style.display='block';return;}
  main.style.display='none';
  const ICONS={Action:'⚔️',Comedy:'😂',Thriller:'🎯',Horror:'👻','Sci-Fi':'🚀',Animation:'🎨',Drama:'🎭',Romance:'❤️',Crime:'🔫',Adventure:'🧭',Documentary:'📽️'};
  document.getElementById('genreTitle').textContent=`${ICONS[genre]||'🎬'} ${genre}`;
  document.getElementById('genreAllLink').href=`/results.html?genre=${encodeURIComponent(genre)}`;
  sec.style.display='block';
  const list=document.getElementById('genreList');
  list.innerHTML=`<div style="padding:28px 14px;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.3);font-size:0.78rem"><div class="spinner"></div>Loading…</div>`;
  sec.scrollIntoView({behavior:'smooth',block:'start'});
  fetch(`/api/genre/${encodeURIComponent(genre)}`)
    .then(r=>r.json())
    .then(d=>{
      list.innerHTML='';
      (d.data?.movies||[]).forEach(m=>list.appendChild(buildCard(m)));
      if(!d.data?.movies?.length)list.innerHTML='<div style="padding:20px;color:rgba(255,255,255,0.3);font-size:0.8rem">No results.</div>';
    })
    .catch(()=>{list.innerHTML='<div style="padding:20px;color:rgba(255,255,255,0.3);font-size:0.8rem">Failed to load.</div>';});
}
function selectTabByName(genre){
  const btn=[...document.querySelectorAll('.cat-tab')].find(b=>b.textContent.trim().includes(genre));
  if(btn){btn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});selectTab(genre,btn);}
}

// ── Search ────────────────────────────────────────────────────
let searchTimer=null;
const searchInput=document.getElementById('searchInput');
const searchDropdown=document.getElementById('searchDropdown');
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);const q=searchInput.value.trim();
  if(!q){searchDropdown.classList.remove('open');return;}
  searchTimer=setTimeout(()=>liveSearch(q),360);
});
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')goSearch();});
document.addEventListener('click',e=>{if(!e.target.closest('.topbar-search'))searchDropdown.classList.remove('open');});

async function liveSearch(q){
  try{
    const res=await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data=await res.json();
    const movies=(data.data?.movies||[]).slice(0,5);
    searchDropdown.innerHTML='';
    if(!movies.length){searchDropdown.innerHTML=`<div style="padding:12px;text-align:center;color:rgba(255,255,255,0.3);font-size:0.78rem">No results</div>`;}
    else{
      movies.forEach(m=>{
        const item=document.createElement('div');item.className='sd-item';
        item.innerHTML=`<img class="sd-poster" src="${m.small_cover_image||''}" alt="${m.title}" loading="lazy"/><div style="flex:1;min-width:0"><div class="sd-title">${m.title_long||m.title}</div><div class="sd-meta">${m.year} · ⭐ ${parseFloat(m.rating||0).toFixed(1)}</div></div>`;
        item.onclick=()=>{haptic([7]);location.href=`/movie.html?id=${m.id}`;};
        searchDropdown.appendChild(item);
      });
      const all=document.createElement('div');all.className='sd-item';
      all.style.cssText='border-top:1px solid rgba(255,255,255,0.07);justify-content:center;color:#d4922a;font-size:0.78rem;font-weight:600';
      all.textContent=`See all results for "${q}"`;
      all.onclick=()=>location.href=`/results.html?q=${encodeURIComponent(q)}`;
      searchDropdown.appendChild(all);
    }
    searchDropdown.classList.add('open');
  }catch{}
}
function goSearch(){const q=searchInput.value.trim();if(q)location.href=`/results.html?q=${encodeURIComponent(q)}`;}

// ── Init ──────────────────────────────────────────────────────
async function init(){
  try{
    const [trending,newR,topR,popular]=await Promise.allSettled([
      fetch('/api/trending').then(r=>r.json()),
      fetch('/api/new').then(r=>r.json()),
      fetch('/api/toprated').then(r=>r.json()),
      fetch('/api/popular').then(r=>r.json()),
    ]);
    if(trending.status==='fulfilled'&&trending.value.data?.movies?.length){
      buildHero(trending.value.data.movies);
      renderRow('trendingList','trendingSkel',trending.value.data.movies);
    }else document.getElementById('trendingSkel').style.display='none';
    if(newR.status==='fulfilled'&&newR.value.data?.movies?.length)
      renderRow('newList','newSkel',newR.value.data.movies);
    else document.getElementById('newSkel').style.display='none';
    if(topR.status==='fulfilled'&&topR.value.data?.movies?.length){
      const sorted=[...topR.value.data.movies].sort((a,b)=>b.year-a.year);
      renderRow('topList','topSkel',sorted);
    }else document.getElementById('topSkel').style.display='none';
    if(popular.status==='fulfilled'&&popular.value.data?.movies?.length){
      const sorted=[...popular.value.data.movies].sort((a,b)=>b.year-a.year);
      renderRow('popList','popSkel',sorted);
    }else document.getElementById('popSkel').style.display='none';
  }catch(err){console.error(err);}
  // Load category card backgrounds staggered after main content
  setTimeout(loadCatBackgrounds, 900);
}
init();
</script>
