<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <meta name="description" content="AdvayStream — Your personal cinema, untethered." />
  <title>AdvayStream</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <style>
    /* ── Hero Layout ─────────────────────────────── */
    .hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      gap: 0;
    }

    /* ── Logo Block ──────────────────────────────── */
    .hero-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
      animation: fade-down 0.8s ease both;
    }

    .hero-badge {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 500;
    }

    .logo-lg {
      line-height: 1;
    }

    .hero-tagline {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.03em;
      margin-top: 6px;
    }

    /* ── Search Card ─────────────────────────────── */
    .search-card {
      width: 100%;
      max-width: 560px;
      padding: 32px 28px;
      animation: fade-up 0.8s ease 0.15s both;
    }

    .search-label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-align: left;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-row .input-wrap {
      flex: 1;
    }

    .search-input {
      font-size: 1rem;
      padding-left: 46px;
    }

    .sort-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .sort-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sort-select {
      flex: 1;
      padding: 10px 16px 10px 36px;
      font-size: 0.88rem;
    }

    .sort-select-wrap {
      flex: 1;
      position: relative;
    }

    .sort-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 0.9rem;
    }

    .search-btn {
      padding: 13px 22px;
      font-size: 0.92rem;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    /* ── Search Tip ──────────────────────────────── */
    .search-tip {
      margin-top: 20px;
      font-size: 0.78rem;
      color: var(--text-faint);
      text-align: center;
      line-height: 1.6;
    }

    .search-tip span {
      color: var(--text-muted);
    }

    /* ── Recent Searches ─────────────────────────── */
    .recents {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .recent-chip {
      padding: 5px 14px;
      border-radius: 100px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .recent-chip:hover {
      border-color: var(--accent);
      color: var(--accent-light);
      background: var(--accent-dim);
    }

    /* ── Footer ──────────────────────────────────── */
    .hero-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-faint);
      background: linear-gradient(to top, rgba(7,8,10,0.9), transparent);
      animation: fade-up 0.8s ease 0.3s both;
    }

    .hero-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    /* ── Keyboard hint ───────────────────────────── */
    .kbd {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.72rem;
      font-family: monospace;
      color: var(--text-muted);
    }

    /* ── Decorative film strip ───────────────────── */
    .filmstrip {
      position: fixed;
      bottom: 44px;
      left: 0;
      right: 0;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 20px,
        rgba(212,146,42,0.08) 20px,
        rgba(212,146,42,0.08) 24px
      );
      pointer-events: none;
    }

    /* ── Animations ──────────────────────────────── */
    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile ──────────────────────────────────── */
    @media (max-width: 480px) {
      .search-card { padding: 24px 18px; }
      .search-row { flex-direction: column; }
      .search-btn { width: 100%; justify-content: center; }
      .sort-row { flex-wrap: wrap; }
    }

    @media (min-width: 768px) {
      .hero-logo-wrap { margin-bottom: 56px; }
      .search-card { padding: 40px 36px; }
    }
  </style>
</head>
<body>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <div class="page hero">
    <!-- Logo -->
    <div class="hero-logo-wrap">
      <span class="hero-badge">Personal Cinema</span>
      <a href="/" class="logo logo-lg">AdvayStream<span class="logo-dot"></span></a>
      <p class="hero-tagline">Your cinema, untethered.</p>
    </div>

    <!-- Search Card -->
    <div class="glass search-card">
      <p class="search-label">🎬 Find a movie</p>

      <!-- Search Input -->
      <div class="search-row">
        <div class="input-wrap">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </span>
          <input
            class="search-input"
            id="searchInput"
            type="search"
            placeholder="M3GAN, Inception, Avengers..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <button class="btn btn-primary search-btn" id="searchBtn" onclick="doSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Search
        </button>
      </div>

      <!-- Sort -->
      <div class="sort-row">
        <span class="sort-label">Sort by</span>
        <div class="sort-select-wrap">
          <span class="sort-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M7 12h10M10 18h4"/></svg>
          </span>
          <select id="sortSelect" class="sort-select">
            <option value="rating">⭐ Rating</option>
            <option value="date_added">🆕 Newest</option>
            <option value="download_count">🔥 Most Downloaded</option>
            <option value="like_count">❤️ Most Liked</option>
            <option value="year">📅 Year</option>
            <option value="title">🔤 Title (A–Z)</option>
          </select>
        </div>
      </div>

      <!-- Recent Searches -->
      <div class="recents" id="recents"></div>

      <!-- Tip -->
      <p class="search-tip">
        Tip: Use exact title for best results. <span>Results: top 10 per search.</span>
      </p>
    </div>

    <!-- Footer -->
    <div class="filmstrip"></div>
    <div class="hero-footer">
      <span>AdvayStream v1.0</span>
      <span>Press <span class="kbd">Enter</span> to search</span>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    // ─── Haptic ───────────────────────────────────────────────────────
    const haptic = (ms = [10]) => navigator.vibrate?.(ms);

    // ─── Toast ────────────────────────────────────────────────────────
    function toast(msg) {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    // ─── Recent Searches ──────────────────────────────────────────────
    function getRecents() {
      try { return JSON.parse(localStorage.getItem('as_recents') || '[]'); }
      catch { return []; }
    }

    function saveRecent(q) {
      let recents = getRecents().filter(r => r.toLowerCase() !== q.toLowerCase());
      recents.unshift(q);
      recents = recents.slice(0, 6);
      localStorage.setItem('as_recents', JSON.stringify(recents));
    }

    function renderRecents() {
      const wrap = document.getElementById('recents');
      const recents = getRecents();
      wrap.innerHTML = recents.map(r =>
        `<button class="recent-chip" onclick="fillSearch('${r.replace(/'/g,"\\'")}')">🕐 ${r}</button>`
      ).join('');
    }

    function fillSearch(q) {
      haptic([6]);
      document.getElementById('searchInput').value = q;
      document.getElementById('searchInput').focus();
    }

    // ─── Search ───────────────────────────────────────────────────────
    function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const sort = document.getElementById('sortSelect').value;

      if (!q) {
        haptic([30, 50, 30]);
        toast('Enter a movie title first');
        document.getElementById('searchInput').focus();
        return;
      }

      haptic([10]);
      saveRecent(q);

      // Navigate to results
      const params = new URLSearchParams({ q, sort });
      window.location.href = `/results.html?${params}`;
    }

    // ─── Events ───────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });

    // ─── Init ─────────────────────────────────────────────────────────
    renderRecents();

    // PWA install
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      window.__pwaPrompt = e;
    });
  </script>
<script src="/pwa.js"></script>
</body>
</html>
