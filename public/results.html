<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Results — AdvayStream</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    /* ── Results Page Layout ──────────────────────────────── */
    .results-page {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
    }

    /* ── Top Bar ─────────────────────────────────────────── */
    .results-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(7,8,10,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }

    .results-meta {
      flex: 1;
      min-width: 0;
    }

    .results-query {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .results-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* ── Wheel Container ─────────────────────────────────── */
    .wheel-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0 100px;
      position: relative;
    }

    .wheel-outer {
      width: 100%;
      max-width: 420px;
      position: relative;
      perspective: 1100px;
      height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-track {
      position: relative;
      width: 88%;
      max-width: 360px;
      transform-style: preserve-3d;
      height: 100%;
    }

    /* ── Wheel Cards ─────────────────────────────────────── */
    .wheel-card {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform-origin: center center;
      cursor: pointer;
      transition:
        transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.45s ease,
        filter 0.45s ease;
      border-radius: var(--radius-lg);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .wheel-card-inner {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
    }

    /* Active card gets special treatment */
    .wheel-card.active .wheel-card-inner {
      border-color: rgba(212,146,42,0.35);
      box-shadow: var(--shadow), 0 0 50px rgba(212,146,42,0.1);
    }

    /* Poster Image */
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    /* Gradient overlay */
    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 16px 16px;
      background: linear-gradient(
        to top,
        rgba(7,8,10,0.98) 0%,
        rgba(7,8,10,0.7) 60%,
        transparent 100%
      );
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-year {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Active card: show CTA arrow */
    .card-cta {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(212,146,42,0.15);
      border: 1px solid rgba(212,146,42,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease, background 0.2s;
      backdrop-filter: blur(8px);
    }

    .wheel-card.active .card-cta {
      opacity: 1;
    }

    .card-cta svg { color: var(--accent-light); width: 16px; height: 16px; }

    /* ── Center Highlight Line ───────────────────────────── */
    .wheel-highlight {
      position: absolute;
      left: -10%;
      right: -10%;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 10;
    }

    .wheel-highlight::before,
    .wheel-highlight::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,146,42,0.3), transparent);
    }

    .wheel-highlight::before { top: -200px; }
    .wheel-highlight::after { bottom: -200px; }

    /* ── Wheel Navigation ────────────────────────────────── */
    .wheel-nav {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      pointer-events: none;
      z-index: 20;
      top: 50%;
      transform: translateY(-50%);
    }

    .wheel-nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      pointer-events: auto;
      transition: var(--transition);
    }

    .wheel-nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent-light);
      background: var(--accent-dim);
    }

    .wheel-nav-btn svg { width: 18px; height: 18px; }

    /* ── Dots Indicator ──────────────────────────────────── */
    .wheel-dots {
      position: absolute;
      bottom: -36px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      transition: var(--transition);
    }

    .dot.active {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      width: 18px;
      border-radius: 3px;
    }

    /* ── Bottom Action ───────────────────────────────────── */
    .wheel-action {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px 28px;
      background: linear-gradient(to top, rgba(7,8,10,0.98), rgba(7,8,10,0.7), transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .action-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .action-btn {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      font-size: 1rem;
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      animation: shimmer 2.5s ease infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    /* ── Scroll Fade Edges ───────────────────────────────── */
    .wheel-fade-top,
    .wheel-fade-bottom {
      position: absolute;
      left: 0; right: 0;
      height: 120px;
      pointer-events: none;
      z-index: 5;
    }

    .wheel-fade-top {
      top: 0;
      background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
    }

    .wheel-fade-bottom {
      bottom: 0;
      background: linear-gradient(to top, var(--bg) 0%, transparent 100%);
    }

    /* ── Loading & Empty ─────────────────────────────────── */
    #stateWrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Desktop wider layout ────────────────────────────── */
    @media (min-width: 768px) {
      .wheel-outer { max-width: 480px; height: 600px; }
    }
  </style>
</head>
<body>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <div class="results-page page">
    <!-- Top Bar -->
    <div class="results-topbar">
      <a class="back-btn" href="/">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="results-meta">
        <div class="results-query" id="queryLabel">Searching…</div>
        <div class="results-count" id="countLabel"></div>
      </div>
      <a class="logo logo-sm" href="/">AS<span class="logo-dot"></span></a>
    </div>

    <!-- State: Loading / Error / Empty -->
    <div id="stateWrap" style="display:none">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <span>Finding movies…</span>
      </div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-icon">🎞️</div>
        <div class="empty-title">No results found</div>
        <div class="empty-sub" id="emptyMsg">Try a different title or check the spelling.</div>
        <a href="/" class="btn btn-ghost" style="margin-top:8px">← Search again</a>
      </div>
    </div>

    <!-- Wheel Section -->
    <div class="wheel-section" id="wheelSection" style="display:none">
      <div class="wheel-outer" id="wheelOuter">
        <div class="wheel-fade-top"></div>
        <div class="wheel-fade-bottom"></div>

        <div class="wheel-nav" id="wheelNav">
          <button class="wheel-nav-btn" id="prevBtn" onclick="navigate(-1)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
          </button>
          <button class="wheel-nav-btn" id="nextBtn" onclick="navigate(1)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>

        <div class="wheel-track" id="wheelTrack"></div>

        <div class="wheel-dots" id="wheelDots"></div>
      </div>
    </div>

    <!-- Bottom Action -->
    <div class="wheel-action" id="wheelAction" style="display:none">
      <p class="action-hint" id="actionHint">Scroll or swipe to browse · Tap card to select</p>
      <button class="btn btn-primary action-btn" id="selectBtn" onclick="openMovie()">
        View Movie Details →
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    // ─── Haptic ───────────────────────────────────────────────────────
    const haptic = (ms = [10]) => navigator.vibrate?.(ms);

    // ─── Toast ────────────────────────────────────────────────────────
    function toast(msg) {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    // ─── URL Params ───────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const QUERY = params.get('q') || '';
    const SORT  = params.get('sort') || 'rating';

    document.getElementById('queryLabel').textContent = `"${QUERY}"`;
    document.title = `${QUERY} — AdvayStream`;

    // ─── State ────────────────────────────────────────────────────────
    let movies = [];
    let currentIndex = 0;
    let isAnimating = false;

    // ─── Show/Hide States ─────────────────────────────────────────────
    function showLoading() {
      document.getElementById('stateWrap').style.display = 'flex';
      document.getElementById('loadingState').style.display = 'flex';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('wheelSection').style.display = 'none';
      document.getElementById('wheelAction').style.display = 'none';
    }

    function showEmpty(msg = '') {
      document.getElementById('stateWrap').style.display = 'flex';
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('emptyState').style.display = 'flex';
      if (msg) document.getElementById('emptyMsg').textContent = msg;
      document.getElementById('wheelSection').style.display = 'none';
      document.getElementById('wheelAction').style.display = 'none';
    }

    function showWheel() {
      document.getElementById('stateWrap').style.display = 'none';
      document.getElementById('wheelSection').style.display = 'flex';
      document.getElementById('wheelAction').style.display = 'flex';
    }

    // ─── Fetch ────────────────────────────────────────────────────────
    async function fetchResults() {
      showLoading();
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(QUERY)}&sort=${SORT}`);
        const data = await res.json();

        if (!res.ok || data.error) throw new Error(data.error || 'Search failed');
        if (!data.data?.movies?.length) {
          showEmpty('No results for this title. Try different keywords.');
          return;
        }

        movies = data.data.movies;
        document.getElementById('countLabel').textContent = `${movies.length} result${movies.length !== 1 ? 's' : ''} found`;
        buildWheel();
        showWheel();

      } catch (err) {
        showEmpty(err.message || 'Failed to search. Check connection.');
      }
    }

    // ─── Build Wheel ──────────────────────────────────────────────────
    function buildWheel() {
      const track = document.getElementById('wheelTrack');
      const dotsWrap = document.getElementById('wheelDots');
      track.innerHTML = '';
      dotsWrap.innerHTML = '';

      movies.forEach((movie, i) => {
        // Card
        const card = document.createElement('div');
        card.className = 'wheel-card';
        card.dataset.index = i;

        const genres = (movie.genres || []).slice(0, 2).map(g =>
          `<span class="pill pill-accent">${g}</span>`
        ).join('');

        card.innerHTML = `
          <div class="wheel-card-inner">
            <img
              class="card-poster"
              src="${movie.large_cover_image || movie.medium_cover_image || ''}"
              alt="${movie.title}"
              loading="${i < 3 ? 'eager' : 'lazy'}"
              onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22><rect fill=%22%230f1012%22 width=%22300%22 height=%22450%22/><text x=%22150%22 y=%22225%22 text-anchor=%22middle%22 fill=%22%233f3c38%22 font-size=%2248%22>🎬</text></svg>'"
            />
            <div class="card-cta">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>
            <div class="card-overlay">
              <div class="card-title">${movie.title}</div>
              <div class="card-meta">
                <span class="card-year">${movie.year}</span>
                ${movie.rating ? `<span class="rating"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>${movie.rating}</span>` : ''}
                ${genres}
              </div>
            </div>
          </div>
        `;

        card.addEventListener('click', () => {
          if (i === currentIndex) {
            haptic([10]);
            openMovie();
          } else {
            haptic([6]);
            goTo(i);
          }
        });

        track.appendChild(card);

        // Dot
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.dataset.index = i;
        dot.onclick = () => { haptic([6]); goTo(i); };
        dotsWrap.appendChild(dot);
      });

      updateWheel(true);
      bindGestures();
    }

    // ─── Wheel Position Math ──────────────────────────────────────────
    // Cards sit on a cylinder. Cylinder rotates on X axis.
    // Front (active) card: rotateX(0), closest to viewer.
    // Each step = 28deg. Cards ±3 steps from center are visible.
    const STEP_DEG = 28;
    const RADIUS = 220; // px — cylinder radius

    function updateWheel(instant = false) {
      const cards = document.querySelectorAll('.wheel-card');
      const dots  = document.querySelectorAll('.dot');

      cards.forEach((card, i) => {
        const offset = i - currentIndex;
        const absOff = Math.abs(offset);
        const angle  = offset * STEP_DEG; // degrees on cylinder

        // Position on cylinder surface
        const translateY = Math.sin(angle * Math.PI / 180) * RADIUS; // vertical position
        const translateZ = (Math.cos(angle * Math.PI / 180) - 1) * RADIUS * 0.6; // depth

        // Visual properties
        const scale   = 1 - absOff * 0.14;
        const opacity = absOff > 3 ? 0 : Math.max(0, 1 - absOff * 0.27);
        const blur    = absOff === 0 ? 0 : Math.min(absOff * 1.8, 5);

        if (instant) card.style.transition = 'none';
        else card.style.transition = 'transform 0.42s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.42s ease, filter 0.42s ease';

        card.style.transform = `translateY(calc(-50% + ${translateY}px)) scale(${scale}) translateZ(${translateZ}px)`;
        card.style.opacity = opacity;
        card.style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
        card.style.zIndex = 100 - absOff * 10;
        card.style.pointerEvents = offset === 0 ? 'auto' : 'none';
        card.classList.toggle('active', i === currentIndex);

        if (instant) {
          requestAnimationFrame(() => {
            card.style.transition = '';
          });
        }
      });

      // Update dots
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });

      // Update action button subtitle
      const m = movies[currentIndex];
      if (m) {
        document.getElementById('actionHint').textContent = m.title + (m.year ? ` (${m.year})` : '');
      }
    }

    // ─── Navigate ─────────────────────────────────────────────────────
    function navigate(dir) {
      haptic([8]);
      const next = currentIndex + dir;
      if (next < 0 || next >= movies.length) {
        haptic([20, 40, 20]);
        return;
      }
      goTo(next);
    }

    function goTo(index) {
      if (isAnimating) return;
      isAnimating = true;
      currentIndex = index;
      updateWheel();
      setTimeout(() => { isAnimating = false; }, 450);
    }

    // ─── Open Movie ───────────────────────────────────────────────────
    function openMovie() {
      const movie = movies[currentIndex];
      if (!movie) return;
      haptic([10, 30, 10]);
      window.location.href = `/movie.html?id=${movie.id}`;
    }

    // ─── Touch / Scroll Gestures ──────────────────────────────────────
    function bindGestures() {
      const outer = document.getElementById('wheelOuter');
      let startY = 0, startTime = 0;
      let isDragging = false;

      // Touch
      outer.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
        startTime = Date.now();
        isDragging = false;
      }, { passive: true });

      outer.addEventListener('touchmove', e => {
        isDragging = true;
      }, { passive: true });

      outer.addEventListener('touchend', e => {
        if (!isDragging) return;
        const dy = e.changedTouches[0].clientY - startY;
        const dt = Date.now() - startTime;
        const velocity = Math.abs(dy) / dt;

        if (Math.abs(dy) > 40 || velocity > 0.3) {
          navigate(dy < 0 ? 1 : -1);
        }
      }, { passive: true });

      // Mouse wheel
      outer.addEventListener('wheel', e => {
        e.preventDefault();
        if (Math.abs(e.deltaY) > 15) {
          navigate(e.deltaY > 0 ? 1 : -1);
        }
      }, { passive: false });

      // Keyboard
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') navigate(1);
        if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  navigate(-1);
        if (e.key === 'Enter') openMovie();
      });
    }

    // ─── Init ─────────────────────────────────────────────────────────
    if (!QUERY) {
      showEmpty('No search query provided.');
    } else {
      fetchResults();
    }
  </script>
<script src="/pwa.js"></script>
</body>
</html>
