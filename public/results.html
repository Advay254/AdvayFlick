<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#060709"/>

  <!-- ── Primary SEO ─────────────────────────────────────────── -->
  <title id="pageTitle">Search Movies — SkyluxMovies</title>
  <meta name="description" id="pageDesc" content="Search thousands of free HD movies on SkyluxMovies. Filter by genre, sort by rating or downloads. No account required."/>
  <meta name="robots" content="index, follow, max-snippet:-1"/>
  <link rel="canonical" href="https://skyluxmovies.onrender.com/results.html"/>

  <!-- ── Open Graph ──────────────────────────────────────────── -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="SkyluxMovies"/>
  <meta property="og:title" content="Search Free HD Movies — SkyluxMovies"/>
  <meta property="og:description" content="Find and download any movie free in HD. Sort by rating, downloads, or date. No sign-up needed."/>
  <meta property="og:url" content="https://skyluxmovies.onrender.com/results.html"/>
  <meta property="og:image" content="https://skyluxmovies.onrender.com/og-image.png"/>
  <meta property="og:image:alt" content="SkyluxMovies search — find free HD movies"/>

  <!-- ── Twitter Card ────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Search Free HD Movies — SkyluxMovies"/>
  <meta name="twitter:description" content="Find and download any movie free in HD. No sign-up needed."/>
  <meta name="twitter:image" content="https://skyluxmovies.onrender.com/og-image.png"/>

  <!-- ── JSON-LD ─────────────────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://skyluxmovies.onrender.com/#website",
        "url": "https://skyluxmovies.onrender.com",
        "name": "SkyluxMovies",
        "publisher": {
          "@type": "Organization",
          "@id": "https://skyluxmovies.onrender.com/#organization",
          "name": "SkyluxMovies",
          "url": "https://skyluxmovies.onrender.com"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://skyluxmovies.onrender.com/results.html?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "WebPage",
        "@id": "https://skyluxmovies.onrender.com/results.html#webpage",
        "url": "https://skyluxmovies.onrender.com/results.html",
        "name": "Search Movies — SkyluxMovies",
        "description": "Search thousands of free HD movies on SkyluxMovies. Filter by genre, sort by rating or downloads.",
        "isPartOf": { "@id": "https://skyluxmovies.onrender.com/#website" },
        "inLanguage": "en-US",
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://skyluxmovies.onrender.com/" },
            { "@type": "ListItem", "position": 2, "name": "Search", "item": "https://skyluxmovies.onrender.com/results.html" }
          ]
        }
      }
    ]
  }
  </script>

  <!-- ── PWA & Icons ──────────────────────────────────────────── -->
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>

  <!-- ── Performance ─────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" href="/style.css" as="style"/>
  <link rel="stylesheet" href="/style.css"/>

  <style>
  .results-page{min-height:100svh;padding-bottom:80px;}
  .results-header{position:sticky;top:0;z-index:100;background:rgba(6,7,9,0.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:11px 14px;}
  .r-search-row{display:flex;gap:9px;align-items:center;}
  .r-search-row .input-wrap{flex:1;}
  .r-search-row input{border-radius:var(--r);}
  .sort-bar{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,0.04);}
  .sort-bar::-webkit-scrollbar{display:none;}
  .sort-btn{flex-shrink:0;padding:5px 13px;border-radius:100px;font-size:0.74rem;font-weight:500;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-2);transition:var(--t);cursor:pointer;white-space:nowrap;}
  .sort-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-l);}
  .results-meta{padding:10px 14px 2px;font-size:0.76rem;color:var(--text-3);}
  .results-meta strong{color:var(--text-2);}
  .results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:9px 14px;}
  .results-grid .movie-card{width:100%;}
  .no-results{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:55px 22px;text-align:center;}
  .no-results-icon{font-size:2.8rem;opacity:0.18;}
  .no-results-title{font-size:0.96rem;font-weight:600;}
  .no-results-sub{font-size:0.8rem;color:var(--text-3);line-height:1.6;}
  @media(min-width:480px){.results-grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:768px){.results-grid{grid-template-columns:repeat(5,1fr);gap:11px;padding:11px 22px;}.results-header,.sort-bar,.results-meta{padding-left:22px;padding-right:22px;}}
  </style>
</head>
<body>
<div class="orb orb-1"></div><div class="orb orb-2"></div>

<div class="results-page">
  <div class="results-header">
    <div class="r-search-row">
      <button class="back-btn" onclick="history.back()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="input-wrap" style="flex:1">
        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
        <input type="search" id="searchInput" placeholder="Search movies…" autocomplete="off"/>
      </div>
      <a href="/" class="logo" style="flex-shrink:0">
        <svg class="logo-mark sm" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="lgr" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f0b84a"/><stop offset="100%" stop-color="#b8722a"/></linearGradient></defs>
          <path d="M20 3L36 20L20 37L4 20Z" stroke="url(#lgr)" stroke-width="1.5" fill="none"/>
          <polygon points="16,14 27,20 16,26" fill="url(#lgr)"/>
        </svg>
      </a>
    </div>
  </div>

  <div class="sort-bar">
    <button class="sort-btn active" data-sort="rating" onclick="setSort('rating',this)">⭐ Rating</button>
    <button class="sort-btn" data-sort="download_count" onclick="setSort('download_count',this)">📥 Popular</button>
    <button class="sort-btn" data-sort="date_added" onclick="setSort('date_added',this)">🆕 Newest</button>
    <button class="sort-btn" data-sort="year" onclick="setSort('year',this)">📅 Year</button>
    <button class="sort-btn" data-sort="like_count" onclick="setSort('like_count',this)">❤️ Liked</button>
  </div>

  <div class="results-meta" id="resultsMeta"></div>
  <div id="resultsContainer"></div>
  <div class="loading-state" id="loadingState" style="display:none"><div class="spinner"></div><span>Searching…</span></div>
</div>

<nav class="bottom-nav">
  <a href="/" class="nav-item">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Home
  </a>
  <button class="nav-item active">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Search
  </button>
  <button class="nav-item" onclick="setSort('date_added',document.querySelector('[data-sort=date_added]'))">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    New
  </button>
  <button class="nav-item" onclick="setSort('rating',document.querySelector('[data-sort=rating]'))">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    Top
  </button>
</nav>
<div class="toast-wrap" id="toastWrap"></div>

<script>
const haptic=ms=>navigator.vibrate?.(ms);
const urlParams=new URLSearchParams(location.search);
let currentQuery=urlParams.get('q')||'';
let currentSort='rating';
let searchTimer=null;

const searchInput=document.getElementById('searchInput');
searchInput.value=currentQuery;
if(currentQuery)search();

function setSort(sort,btn){
  haptic([6]);currentSort=sort;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(currentQuery)search();
}

searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    currentQuery=searchInput.value.trim();
    if(currentQuery){history.replaceState(null,'',`?q=${encodeURIComponent(currentQuery)}`);search();}
    else{document.getElementById('resultsContainer').innerHTML='';document.getElementById('resultsMeta').textContent='';}
  },400);
});
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);currentQuery=searchInput.value.trim();if(currentQuery)search();}});

async function search(){
  if(!currentQuery)return;
  document.title=`"${currentQuery}" — SkyluxMovies`;
  document.getElementById('loadingState').style.display='flex';
  document.getElementById('resultsContainer').innerHTML='';
  document.getElementById('resultsMeta').textContent='';
  try{
    const res=await fetch(`/api/search?q=${encodeURIComponent(currentQuery)}&sort=${currentSort}`);
    const data=await res.json();
    const movies=data.data?.movies||[];
    document.getElementById('loadingState').style.display='none';
    if(!movies.length){showEmpty();return;}
    document.getElementById('resultsMeta').innerHTML=`<strong>${movies.length}</strong> results for "<strong>${currentQuery}</strong>"`;
    const grid=document.createElement('div');grid.className='results-grid';
    movies.forEach(m=>{
      const card=document.createElement('div');card.className='movie-card';
      const rating=parseFloat(m.rating)||0;
      card.innerHTML=`<img class="card-poster" src="${m.medium_cover_image||''}" alt="${m.title}" loading="lazy" onerror="this.style.background='var(--surface2)'"/>${rating?`<div class="card-badge"><svg xmlns="http://www.w3.org/2000/svg" width="7" height="7" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${rating.toFixed(1)}</div>`:''}<div class="card-footer"><div class="card-title">${m.title}</div><div class="card-meta"><span class="card-year">${m.year}</span></div></div>`;
      card.addEventListener('click',()=>{haptic([8]);location.href=`/movie.html?id=${m.id}`;});
      grid.appendChild(card);
    });
    document.getElementById('resultsContainer').appendChild(grid);
  }catch(err){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('resultsContainer').innerHTML=`<div class="no-results"><div class="no-results-icon">⚠️</div><div class="no-results-title">Search Failed</div><div class="no-results-sub">Check your connection</div><button class="btn btn-ghost btn-sm" onclick="search()" style="margin-top:10px">Try Again</button></div>`;
  }
}

function showEmpty(){
  document.getElementById('resultsContainer').innerHTML=`<div class="no-results"><div class="no-results-icon">🔍</div><div class="no-results-title">No results for "${currentQuery}"</div><div class="no-results-sub">Try a shorter title, check spelling,<br>or search by genre keyword.</div></div>`;
}
</script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var q = params.get("q") || "";
  var genre = params.get("genre") || "";
  if (q) {
    var t = '"' + q + '" Movies — Free HD Download — SkyluxMovies';
    var d = 'Download "' + q + '" free in HD on SkyluxMovies. No account required.';
    document.title = t;
    var dm = document.getElementById("pageDesc");
    if (dm) dm.setAttribute("content", d);
  } else if (genre) {
    document.title = 'Free ' + genre + ' Movies — SkyluxMovies';
  }
})();
</script>
<script src="/pwa.js"></script>
</body>
