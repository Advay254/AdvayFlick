<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Movie — AdvayStream</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    /* ── Movie Page ───────────────────────────────────────── */
    .movie-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* ── Hero Backdrop ───────────────────────────────────── */
    .movie-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .backdrop-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(40px) saturate(0.4) brightness(0.25);
      transform: scale(1.1);
      transition: opacity 0.8s ease;
      opacity: 0;
    }

    .backdrop-img.loaded { opacity: 1; }

    .backdrop-grad {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(7,8,10,0.4) 0%,
        rgba(7,8,10,0.2) 30%,
        rgba(7,8,10,0.7) 70%,
        rgba(7,8,10,1) 100%
      );
    }

    /* ── Top Bar ─────────────────────────────────────────── */
    .movie-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(7,8,10,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }

    /* ── Content ─────────────────────────────────────────── */
    .movie-content {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 24px 20px 120px;
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Poster + Info ───────────────────────────────────── */
    .movie-hero {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .poster-wrap {
      flex-shrink: 0;
      width: 120px;
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow), 0 0 30px rgba(0,0,0,0.6);
      background: var(--surface);
      display: block;
    }

    .movie-info {
      flex: 1;
      min-width: 0;
      padding-top: 4px;
    }

    .movie-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 8px;
    }

    .movie-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .meta-item {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .meta-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
    }

    .genres-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* ── Summary ─────────────────────────────────────────── */
    .summary-section {
      margin-bottom: 24px;
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .summary-text {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text-muted);
      font-weight: 300;
    }

    .no-summary {
      font-size: 0.85rem;
      color: var(--text-faint);
      font-style: italic;
    }

    /* ── Quality Picker ──────────────────────────────────── */
    .quality-section {
      margin-bottom: 24px;
    }

    .quality-select-wrap {
      position: relative;
    }

    .quality-select {
      width: 100%;
      padding: 14px 46px 14px 16px;
      font-size: 0.95rem;
    }

    .quality-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Quality info card — shows after selection */
    .quality-info {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      display: none;
    }

    .quality-info.visible { display: flex; gap: 12px; flex-wrap: wrap; }

    .qinfo-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .qinfo-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
    }

    .qinfo-value {
      font-size: 0.85rem;
      color: var(--text);
      font-weight: 500;
    }

    /* ── Download / Stream Section ───────────────────────── */
    .download-section {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .download-section.visible { display: flex; }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .download-btn, .stream-btn {
      padding: 16px 12px;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    /* ── Torrent Progress UI ─────────────────────────────── */
    .torrent-panel {
      display: none;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      border-radius: var(--radius);
    }

    .torrent-panel.active { display: flex; }

    .torrent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .torrent-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .torrent-status {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 500;
    }

    .torrent-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
    }

    .stat-value {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    /* ── Video Player ────────────────────────────────────── */
    .video-wrap {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .video-wrap.active { display: flex; }

    .video-player {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .video-player video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .video-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Torrent container (hidden) ──────────────────────── */
    #torrentContainer { display: none; }

    /* ── Loading State ───────────────────────────────────── */
    .page-loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-muted);
    }

    /* ── Trailer Link ────────────────────────────────────── */
    .trailer-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 100px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      transition: var(--transition);
    }

    .trailer-btn:hover {
      color: var(--accent-light);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── Desktop ─────────────────────────────────────────── */
    @media (min-width: 600px) {
      .movie-poster { width: 140px; }
      .movie-title { font-size: 1.4rem; }
      .action-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <!-- Backdrop -->
  <div class="movie-backdrop">
    <img class="backdrop-img" id="backdropImg" alt="" />
    <div class="backdrop-grad"></div>
  </div>

  <div class="movie-page page">
    <!-- Top Bar -->
    <div class="movie-topbar">
      <button class="back-btn" onclick="history.back()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </button>
      <div style="flex:1"></div>
      <a class="logo logo-sm" href="/">AS<span class="logo-dot"></span></a>
    </div>

    <!-- Page Loading -->
    <div class="page-loading" id="pageLoading">
      <div class="spinner"></div>
      <span>Loading movie…</span>
    </div>

    <!-- Main Content (hidden until loaded) -->
    <div class="movie-content" id="movieContent" style="display:none">

      <!-- Hero: Poster + Info -->
      <div class="movie-hero reveal" id="movieHero">
        <div class="poster-wrap">
          <img class="movie-poster" id="posterImg" alt="" />
        </div>
        <div class="movie-info">
          <h1 class="movie-title" id="movieTitle"></h1>
          <div class="movie-meta-row" id="metaRow"></div>
          <div class="genres-row" id="genresRow"></div>
          <div style="margin-top:10px" id="trailerRow"></div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Summary -->
      <div class="summary-section reveal" id="summarySection">
        <p class="section-label">Synopsis</p>
        <p class="summary-text" id="summaryText"></p>
      </div>

      <div class="divider"></div>

      <!-- Quality Picker -->
      <div class="quality-section reveal">
        <p class="section-label">Select Quality</p>
        <div class="quality-select-wrap">
          <select id="qualitySelect" onchange="onQualityChange()">
            <option value="">— Choose quality —</option>
          </select>
          <span class="quality-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </span>
        </div>

        <!-- Quality info -->
        <div class="quality-info glass" id="qualityInfo"></div>
      </div>

      <!-- Download / Stream Buttons -->
      <div class="download-section" id="downloadSection">
        <div class="action-grid">
          <button class="btn btn-primary download-btn" onclick="startAction('download')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </button>
          <button class="btn btn-ghost stream-btn" onclick="startAction('stream')">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Stream
          </button>
        </div>
        <p style="font-size:0.72rem;color:var(--text-faint);text-align:center">
          Streams & downloads via BitTorrent in your browser
        </p>
      </div>

      <!-- Video Player -->
      <div class="video-wrap" id="videoWrap">
        <div class="video-player" id="videoPlayer"></div>
        <p class="video-label">Streaming via WebTorrent · Keep this tab open</p>
      </div>

      <!-- Torrent Progress Panel -->
      <div class="glass torrent-panel" id="torrentPanel">
        <div class="torrent-header">
          <span class="torrent-title" id="torrentTitle">Connecting…</span>
          <span class="torrent-status" id="torrentStatus">Initializing</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="torrentProgress" style="width:0%"></div>
        </div>
        <div class="torrent-stats">
          <div class="stat-item">
            <span class="stat-label">Downloaded</span>
            <span class="stat-value" id="statDone">0 MB</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Speed</span>
            <span class="stat-value" id="statSpeed">0 KB/s</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Peers</span>
            <span class="stat-value" id="statPeers">0</span>
          </div>
        </div>
        <button class="btn btn-ghost" onclick="stopTorrent()" style="font-size:0.85rem;padding:10px">
          ⛔ Stop
        </button>
      </div>

      <!-- Hidden WebTorrent mount -->
      <div id="torrentContainer"></div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- WebTorrent -->
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@2/webtorrent.min.js"></script>
  <script>
    // ─── Haptic & Toast ───────────────────────────────────────────────
    const haptic = (ms = [10]) => navigator.vibrate?.(ms);

    function toast(msg) {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    // ─── State ────────────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const MOVIE_ID = params.get('id');
    let movieData = null;
    let selectedTorrent = null;
    let wtClient = null;
    let activeTorrent = null;

    // ─── Scroll Reveal ────────────────────────────────────────────────
    const revealObs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          revealObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });

    // ─── Utility ─────────────────────────────────────────────────────
    function fmtBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
    }

    function buildMagnet(hash, title) {
      return `magnet:?xt=urn:btih:${hash}&dn=${encodeURIComponent(title)}&tr=udp://open.demonii.com:1337/announce&tr=udp://tracker.openbittorrent.com:80&tr=udp://tracker.opentrackr.org:1337/announce&tr=udp://exodus.desync.com:6969/announce`;
    }

    // ─── Fetch Movie ──────────────────────────────────────────────────
    async function fetchMovie() {
      if (!MOVIE_ID) {
        document.getElementById('pageLoading').innerHTML = `<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-title">No movie ID</div><a href="/" class="btn btn-ghost" style="margin-top:12px">← Go Home</a></div>`;
        return;
      }

      try {
        const res = await fetch(`/api/movie/${MOVIE_ID}`);
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Failed');
        movieData = data.data.movie;
        renderMovie();
      } catch (err) {
        document.getElementById('pageLoading').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">${err.message}</div><button class="btn btn-ghost" onclick="fetchMovie()" style="margin-top:12px">Retry</button></div>`;
      }
    }

    // ─── Render Movie ─────────────────────────────────────────────────
    function renderMovie() {
      const m = movieData;
      document.title = `${m.title} — AdvayStream`;

      // Backdrop
      const bd = document.getElementById('backdropImg');
      bd.src = m.background_image_original || m.background_image || m.large_cover_image || '';
      bd.onload = () => bd.classList.add('loaded');

      // Poster
      document.getElementById('posterImg').src = m.large_cover_image || m.medium_cover_image || '';
      document.getElementById('posterImg').alt = m.title;

      // Title
      document.getElementById('movieTitle').textContent = m.title_long || m.title;

      // Meta row
      const meta = [];
      if (m.year) meta.push(`<span class="meta-item">${m.year}</span>`);
      if (m.runtime) meta.push(`<span class="meta-sep"></span><span class="meta-item">${m.runtime} min</span>`);
      if (m.rating) meta.push(`<span class="meta-sep"></span><span class="rating"><svg viewBox="0 0 24 24" width="13" height="13" fill="#f0b84a"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>${m.rating}/10</span>`);
      if (m.language) meta.push(`<span class="meta-sep"></span><span class="meta-item">${m.language.toUpperCase()}</span>`);
      document.getElementById('metaRow').innerHTML = meta.join('');

      // Genres
      const genres = (m.genres || []).map(g => `<span class="pill pill-accent">${g}</span>`).join('');
      document.getElementById('genresRow').innerHTML = genres;

      // Trailer
      if (m.yt_trailer_code) {
        document.getElementById('trailerRow').innerHTML = `
          <a class="trailer-btn" href="https://www.youtube.com/watch?v=${m.yt_trailer_code}" target="_blank" rel="noopener">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21.543 6.498C22 8.28 22 12 22 12s0 3.72-.457 5.502c-.254.985-.997 1.76-1.938 2.022C17.896 20 12 20 12 20s-5.893 0-7.605-.476c-.945-.266-1.687-1.04-1.938-2.022C2 15.72 2 12 2 12s0-3.72.457-5.502c.254-.985.997-1.76 1.938-2.022C6.107 4 12 4 12 4s5.896 0 7.605.476c.945.266 1.687 1.04 1.938 2.022zM10 15.5l6-3.5-6-3.5v7z"/></svg>
            Watch Trailer
          </a>
        `;
      }

      // Summary
      const summary = m.description_full || m.summary || m.synopsis || '';
      document.getElementById('summaryText').innerHTML = summary
        ? summary
        : '<span class="no-summary">No synopsis available for this title.</span>';

      // Torrents
      const qualitySelect = document.getElementById('qualitySelect');
      qualitySelect.innerHTML = '<option value="">— Choose quality —</option>';
      (m.torrents || []).forEach((t, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${t.quality} ${t.type ? `(${t.type})` : ''} · ${t.size} · ${t.video_codec || ''}`;
        opt.dataset.index = i;
        qualitySelect.appendChild(opt);
      });

      // Show content, hide loader
      document.getElementById('pageLoading').style.display = 'none';
      document.getElementById('movieContent').style.display = 'flex';
      document.getElementById('movieContent').style.flexDirection = 'column';

      // Trigger scroll reveal
      document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));
    }

    // ─── Quality Change ───────────────────────────────────────────────
    function onQualityChange() {
      haptic([6]);
      const sel = document.getElementById('qualitySelect');
      const idx = sel.value;
      const infoEl = document.getElementById('qualityInfo');
      const dlSection = document.getElementById('downloadSection');

      if (idx === '') {
        infoEl.classList.remove('visible');
        dlSection.classList.remove('visible');
        selectedTorrent = null;
        return;
      }

      selectedTorrent = movieData.torrents[parseInt(idx)];

      // Show quality info
      const seeds = selectedTorrent.seeds || 0;
      const seedColor = seeds >= 10 ? 'var(--success)' : seeds >= 3 ? 'var(--accent)' : 'var(--danger)';

      infoEl.innerHTML = `
        <div class="qinfo-item">
          <span class="qinfo-label">Size</span>
          <span class="qinfo-value">${selectedTorrent.size}</span>
        </div>
        <div class="qinfo-item">
          <span class="qinfo-label">Codec</span>
          <span class="qinfo-value">${selectedTorrent.video_codec || '—'}</span>
        </div>
        <div class="qinfo-item">
          <span class="qinfo-label">Audio</span>
          <span class="qinfo-value">${selectedTorrent.audio_channels || '—'}</span>
        </div>
        <div class="qinfo-item">
          <span class="qinfo-label">Seeds</span>
          <span class="qinfo-value" style="color:${seedColor}">${seeds} 🌱</span>
        </div>
        <div class="qinfo-item">
          <span class="qinfo-label">Type</span>
          <span class="qinfo-value">${selectedTorrent.type || '—'}</span>
        </div>
      `;

      infoEl.classList.add('visible');
      dlSection.classList.add('visible');

      if (seeds < 2) toast('⚠️ Low seeds — download may be slow');
    }

    // ─── Start Action ─────────────────────────────────────────────────
    function startAction(mode) {
      if (!selectedTorrent) { toast('Select a quality first'); return; }
      haptic([10, 30, 10]);

      const magnet = buildMagnet(selectedTorrent.hash, movieData.title_long || movieData.title);
      startWebTorrent(magnet, mode);
    }

    // ─── WebTorrent ───────────────────────────────────────────────────
    function startWebTorrent(magnet, mode) {
      // Clean up previous
      stopTorrent(false);

      // Init client
      wtClient = new WebTorrent();

      // Show panel
      document.getElementById('torrentPanel').classList.add('active');
      document.getElementById('torrentTitle').textContent = movieData.title;
      document.getElementById('torrentStatus').textContent = 'Connecting to peers…';
      document.getElementById('torrentProgress').style.width = '0%';

      toast('🌐 Connecting to peers…');

      wtClient.add(magnet, { path: 'advaystream' }, torrent => {
        activeTorrent = torrent;
        document.getElementById('torrentStatus').textContent = 'Downloading…';
        toast(`✅ Connected · ${torrent.numPeers} peer${torrent.numPeers !== 1 ? 's' : ''}`);

        // Find video file
        const videoFile = torrent.files.find(f =>
          f.name.match(/\.(mp4|mkv|avi|mov|webm|m4v)$/i)
        );

        if (videoFile && mode === 'stream') {
          // Stream in video element
          const wrap = document.getElementById('videoWrap');
          const player = document.getElementById('videoPlayer');
          player.innerHTML = '<video controls autoplay playsinline style="width:100%;height:100%"></video>';
          const video = player.querySelector('video');
          videoFile.renderTo(video, { autoplay: true });
          wrap.classList.add('active');
          toast('▶️ Streaming started');
        }

        // Progress update
        const interval = setInterval(() => {
          if (!activeTorrent) { clearInterval(interval); return; }
          const pct = (torrent.progress * 100).toFixed(1);
          document.getElementById('torrentProgress').style.width = pct + '%';
          document.getElementById('torrentStatus').textContent = `${pct}%`;
          document.getElementById('statDone').textContent = fmtBytes(torrent.downloaded);
          document.getElementById('statSpeed').textContent = fmtBytes(torrent.downloadSpeed) + '/s';
          document.getElementById('statPeers').textContent = torrent.numPeers;
        }, 1000);

        // On done
        torrent.on('done', () => {
          clearInterval(interval);
          document.getElementById('torrentProgress').style.width = '100%';
          document.getElementById('torrentStatus').textContent = 'Complete ✓';
          haptic([30, 50, 30]);
          toast('✅ Download complete!');

          // Save to device
          if (mode === 'download' && videoFile) {
            videoFile.getBlobURL((err, url) => {
              if (err) { toast('Error saving file'); return; }
              const a = document.createElement('a');
              a.href = url;
              a.download = videoFile.name;
              a.click();
            });
          }
        });

        torrent.on('error', err => {
          clearInterval(interval);
          document.getElementById('torrentStatus').textContent = 'Error';
          toast('⚠️ Torrent error: ' + (err.message || 'Unknown'));
        });
      });

      wtClient.on('error', err => {
        document.getElementById('torrentStatus').textContent = 'Failed';
        toast('⚠️ ' + (err.message || 'WebTorrent error'));
      });
    }

    // ─── Stop Torrent ─────────────────────────────────────────────────
    function stopTorrent(notify = true) {
      if (wtClient) {
        try { wtClient.destroy(); } catch(e) {}
        wtClient = null;
      }
      activeTorrent = null;
      document.getElementById('torrentPanel').classList.remove('active');
      document.getElementById('videoWrap').classList.remove('active');
      document.getElementById('videoPlayer').innerHTML = '';
      if (notify) {
        haptic([10]);
        toast('Stopped');
      }
    }

    // ─── Init ─────────────────────────────────────────────────────────
    fetchMovie();

    // Stop torrent on page leave
    window.addEventListener('beforeunload', () => stopTorrent(false));
  </script>
<script src="/pwa.js"></script>
</body>
</html>
